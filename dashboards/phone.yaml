# Snapmaker U1 3D Printer dashboard  -  PHONE (v3, clean layout)
#
# Single column: completion banner, two print previews, filename + countdown, camera, progress, controls,
# tool cards (red = heating, blue = cooling, green = sleeping, amber/red = holding),
# bed / enclosure / layers / memory, then the fun filament fact and lifetime stats.
#
# INSTALL
#   1. snapmaker_u1_templates.yaml and snapmaker_u1_tool_trend_sensors.yaml must already be installed.
#   2. Dashboard -> (pencil) -> (three dots) -> Raw configuration editor -> paste -> Save.
# HACS frontend cards used: Mushroom and card-mod.

title: Snapmaker U1
views:
  - title: 3D Printer
    path: printer
    icon: mdi:printer-3d
    background: "radial-gradient(1100px 700px at 50% 0%, rgba(148,163,184,0.22), transparent 62%), linear-gradient(180deg, #0f172a 0%, #0b1120 100%) fixed"
    type: sections
    max_columns: 1
    sections:
      - type: grid
        column_span: 1
        cards:
          - type: custom:mushroom-template-card
            entity: sensor.YOURPRINTER_slicer_print_time_left_estimate
            layout: horizontal
            fill_container: true
            icon_type: none
            multiline_secondary: true
            primary: >
              {% set s = states('sensor.YOURPRINTER_current_print_state') %}
              {% set ly = states('sensor.YOURPRINTER_current_layer') | float(0) %}
              {% set bed = states('sensor.snapmaker_u1_bed_temp_f') | float(0) %}
              {% set pk = states('sensor.snapmaker_u1_bed_peak_temp_f') | float(bed) %}
              {% set pc = ([0, ([100, ((pk - bed) / (pk - 104) * 100) if pk - bed >= 0 and pk - 104 > 5 else 100] | min)] | max) | round(0) | int %}
              {% if s == 'printing' %}{% set stage = 'preparing' if ly <= 0 else 'printing' %}
              {% elif s == 'complete' %}{% set stage = 'cooling' if bed > 104 else 'ready' %}
              {% elif s in ['paused', 'error', 'cancelled'] %}{% set stage = s %}
              {% else %}{% set stage = 'idle' %}{% endif %}
              {% set sx = states('sensor.snapmaker_u1_print_stage') %}
              {% if sx not in ['unknown', 'unavailable', 'none', ''] %}{% set stage = sx %}{% endif %}
              {% set e = 'sensor.YOURPRINTER_slicer_print_time_left_estimate' %}
              {% set v = states(e) %}
              {% if stage in ['printing','paused'] %}
              {% if is_number(v) %}
              {% set u = state_attr(e, 'unit_of_measurement') | default(('h' if v | float(0) < 100 else 's'), true) %}
              {% set mins = (v | float * (60 if u in ['h','hr','hrs','hour','hours'] else 1 if u in ['min','m','mins','minute','minutes'] else 1/60)) | round(0) | int %}
              {% set t = now() + timedelta(minutes=mins) %}
              Estimated completion is {{ t.strftime('%-I:%M %p') }}
              {% else %}Estimating completion time…{% endif %}
              {% elif stage == 'preparing' %}Preparing · bed warming up
              {% elif stage == 'cooling' %}Cooling Bed · {{ bed | round(0) | int }}°F
              {% elif stage == 'ready' %}Complete - Ready to remove print
              {% elif stage == 'waiting' %}Waiting for new print job...
              {% elif stage == 'error' %}Printer error
              {% elif stage == 'cancelled' %}Print cancelled
              {% else %}No print running{% endif %}
            secondary: >
              {% set s = states('sensor.YOURPRINTER_current_print_state') %}
              {% set ly = states('sensor.YOURPRINTER_current_layer') | float(0) %}
              {% set bed = states('sensor.snapmaker_u1_bed_temp_f') | float(0) %}
              {% set pk = states('sensor.snapmaker_u1_bed_peak_temp_f') | float(bed) %}
              {% set pc = ([0, ([100, ((pk - bed) / (pk - 104) * 100) if pk - bed >= 0 and pk - 104 > 5 else 100] | min)] | max) | round(0) | int %}
              {% if s == 'printing' %}{% set stage = 'preparing' if ly <= 0 else 'printing' %}
              {% elif s == 'complete' %}{% set stage = 'cooling' if bed > 104 else 'ready' %}
              {% elif s in ['paused', 'error', 'cancelled'] %}{% set stage = s %}
              {% else %}{% set stage = 'idle' %}{% endif %}
              {% set sx = states('sensor.snapmaker_u1_print_stage') %}
              {% if sx not in ['unknown', 'unavailable', 'none', ''] %}{% set stage = sx %}{% endif %}
              {% set e = 'sensor.YOURPRINTER_slicer_print_time_left_estimate' %}
              {% set v = states(e) %}
              {% if stage in ['printing','paused'] and is_number(v) %}
              {% set u = state_attr(e, 'unit_of_measurement') | default(('h' if v | float(0) < 100 else 's'), true) %}
              {% set mins = (v | float * (60 if u in ['h','hr','hrs','hour','hours'] else 1 if u in ['min','m','mins','minute','minutes'] else 1/60)) | round(0) | int %}
              {% set t = now() + timedelta(minutes=mins) %}
              {% set dd = (t.date() - now().date()).days %}
              {% set day = 'Today' if dd == 0 else 'Tomorrow' if dd == 1 else '' %}
              {{ (day ~ ' · ') if day else '' }}{{ t.strftime('%A, %B %-d') }}{% if stage == 'paused' %} · PAUSED, estimate will slip{% endif %}
              {% elif stage == 'preparing' %}Bed at {{ bed | round(0) | int }}°F · printing starts at layer 1
              {% elif stage == 'cooling' %}Print complete · {{ pc }}% cooled · safe to remove at 104°F (40°C)
              {% elif stage == 'ready' %}Bed is {{ bed | round(0) | int }}°F (below 104°F / 40°C)
              {% elif stage == 'waiting' %}Last job: {{ states('sensor.YOURPRINTER_filename') | replace('.gcode','') | replace('_',' ') }}
              {% elif stage in ['error','cancelled'] %}Check the printer
              {% else %}Snapmaker U1 is idle{% endif %}
            grid_options:
              columns: full
            tap_action:
              action: none
            card_mod:
              style: |
                {% set s = states('sensor.YOURPRINTER_current_print_state') %}
                {% set ly = states('sensor.YOURPRINTER_current_layer') | float(0) %}
                {% set bed = states('sensor.snapmaker_u1_bed_temp_f') | float(0) %}
                {% set pk = states('sensor.snapmaker_u1_bed_peak_temp_f') | float(bed) %}
                {% set pc = ([0, ([100, ((pk - bed) / (pk - 104) * 100) if pk - bed >= 0 and pk - 104 > 5 else 100] | min)] | max) | round(0) | int %}
                {% if s == 'printing' %}{% set stage = 'preparing' if ly <= 0 else 'printing' %}
                {% elif s == 'complete' %}{% set stage = 'cooling' if bed > 104 else 'ready' %}
                {% elif s in ['paused', 'error', 'cancelled'] %}{% set stage = s %}
                {% else %}{% set stage = 'idle' %}{% endif %}
                {% set sx = states('sensor.snapmaker_u1_print_stage') %}
                {% if sx not in ['unknown', 'unavailable', 'none', ''] %}{% set stage = sx %}{% endif %}
                {% if stage in ['printing','paused'] %}
                {% set bg = 'linear-gradient(120deg, #ec4899, #8b5cf6, #3b82f6, #06b6d4, #22c55e, #f59e0b, #ec4899)' %}
                {% set anim = 'snapGradient 14s ease infinite' %}
                {% set glow = 'rgba(139,92,246,0.45)' %}
                {% elif stage == 'preparing' %}
                {% set bg = 'linear-gradient(120deg, #f59e0b, #f97316, #ef4444)' %}
                {% set anim = 'none' %}
                {% set glow = 'rgba(249,115,22,0.45)' %}
                {% elif stage == 'cooling' %}
                {% set bg = 'linear-gradient(120deg, #1d4ed8, #0ea5e9, #06b6d4)' %}
                {% set anim = 'none' %}
                {% set glow = 'rgba(14,165,233,0.45)' %}
                {% elif stage == 'ready' %}
                {% set bg = 'linear-gradient(120deg, #16a34a, #22c55e, #10b981)' %}
                {% set anim = 'none' %}
                {% set glow = 'rgba(34,197,94,0.45)' %}
                {% elif stage == 'waiting' %}
                {% set bg = 'linear-gradient(120deg, #1e293b, #334155, #3730a3)' %}
                {% set anim = 'none' %}
                {% set glow = 'rgba(79,70,229,0.35)' %}
                {% elif stage in ['error','cancelled'] %}
                {% set bg = 'linear-gradient(120deg, #b91c1c, #ef4444)' %}
                {% set anim = 'none' %}
                {% set glow = 'rgba(239,68,68,0.35)' %}
                {% else %}
                {% set bg = 'linear-gradient(120deg, #334155, #475569)' %}
                {% set anim = 'none' %}
                {% set glow = 'rgba(100,116,139,0.25)' %}
                {% endif %}
                ha-card {
                  zoom: 1.2;
                  border-radius: 24px;
                  overflow: hidden;
                  color: white;
                  text-shadow: 0 2px 6px rgba(0,0,0,0.55);
                  background: {{ bg }};
                  background-size: 300% 300%;
                  animation: {{ anim }};
                  box-shadow: 0 0 28px {{ glow }};
                }
                @keyframes snapGradient {
                  0% { background-position: 0% 50%; }
                  50% { background-position: 100% 50%; }
                  100% { background-position: 0% 50%; }
                }
                @media (prefers-reduced-motion: reduce) {
                  ha-card { animation: none; }
                }
          - type: horizontal-stack
            card_mod:
              style: |
                #root { display: grid !important; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) !important; gap: 8px !important; align-items: start !important; }
            cards:
              - type: vertical-stack
                card_mod:
                  style: |
                    #root { --stack-card-gap: 0px; gap: 0px; }
                cards:
                  - type: conditional
                    conditions:
                    - condition: state
                      entity: sensor.snapmaker_u1_print_stage
                      state: [preparing, printing, paused, cooling, ready]
                    card:
                      type: markdown
                      content: |
                        {% set st = states('sensor.snapmaker_u1_print_stage') %}
                        {% set t = (as_timestamp(now()) // 60) | int %}
                        {% if st in ['preparing', 'printing', 'paused'] %}{% set a = state_attr('camera.YOURPRINTER_thumbnail', 'entity_picture') | default('', true) %}{% else %}{% set a = '/local/snapmaker_u1_thumb.jpg?v=' ~ (as_timestamp(states.sensor.YOURPRINTER_filename.last_changed) | int(0)) %}{% endif %}
                        <img src="{{ a }}"><img src="/local/snapmaker_u1_model_angle.png?v={{ t }}">
                      card_mod:
                        style:
                          .: |
                            ha-card {
                              aspect-ratio: 1 / 1;
                              position: relative;
                              border-radius: 16px;
                              overflow: hidden;
                              border: 1px solid rgba(148,163,184,0.16);
                              background: #1c1c1c;
                            }
                            ha-markdown { padding: 0 !important; width: 100%; height: 100%; }
                          ha-markdown$: |
                            p { margin: 0; height: 100%; }
                            img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; display: block; }
                            img:nth-of-type(1) { transform: scaleX(-1); animation: snapSwapA 10s infinite; }
                            img:nth-of-type(2) { animation: snapSwapB 10s infinite; }
                            @keyframes snapSwapA { 0%, 45% { opacity: 1; } 50%, 95% { opacity: 0; } 100% { opacity: 1; } }
                            @keyframes snapSwapB { 0%, 45% { opacity: 0; } 50%, 95% { opacity: 1; } 100% { opacity: 0; } }
                  - type: conditional
                    conditions:
                    - condition: state
                      entity: sensor.snapmaker_u1_print_stage
                      state_not: [preparing, printing, paused, cooling, ready]
                    card:
                      type: markdown
                      content: |
                        <ha-icon icon="mdi:cube-scan"></ha-icon>

                        **No active job**

                        Send a print to the U1 and its preview shows up here
                      card_mod:
                        style:
                          .: |
                            ha-card {
                              aspect-ratio: 1 / 1;
                              display: flex; align-items: center; justify-content: center; text-align: center;
                              border-radius: 16px;
                              border: 2px dashed rgba(148,163,184,0.45);
                              background: radial-gradient(300px 200px at 50% 0%, rgba(99,102,241,0.18), transparent 70%), rgba(15,23,42,0.75);
                            }
                            ha-markdown { padding: 0 14px !important; color: #94a3b8 !important; font-size: 13px; }
                            ha-markdown p { margin: 4px 0 !important; }
                          ha-markdown$: |
                            ha-icon { --mdc-icon-size: 64px; color: #64748b; display: block; margin: 0 auto; }
                            p { margin: 4px 0; }
              - type: vertical-stack
                card_mod:
                  style: |
                    #root { --stack-card-gap: 0px; gap: 0px; }
                cards:
                  - type: conditional
                    conditions:
                    - condition: state
                      entity: sensor.snapmaker_u1_print_stage
                      state: [preparing, printing, paused, cooling, ready]
                    card:
                      type: markdown
                      content: |
                        {% set t = (as_timestamp(now()) // 60) | int %}
                        <img src="/local/snapmaker_u1_progress.png?v={{ t }}">

                        Layer {{ states('sensor.YOURPRINTER_current_layer') | int(0) }} / {{ states('sensor.YOURPRINTER_total_layer') | int(0) }}
                      card_mod:
                        style:
                          .: |
                            ha-card {
                              aspect-ratio: 1 / 1;
                              position: relative;
                              border-radius: 16px;
                              overflow: hidden;
                              border: 1px solid rgba(148,163,184,0.16);
                              background: #1c1c1c;
                            }
                            ha-markdown { padding: 0 !important; width: 100%; height: 100%; }
                          ha-markdown$: |
                            p { margin: 0; height: 100%; }
                            img { width: 100%; height: 100%; object-fit: contain; display: block; }
                            p:nth-of-type(2) { position: absolute; left: 8px; bottom: 6px; height: auto; font-size: 12px; font-weight: 600;
                              color: #cbd5e1; background: rgba(0,0,0,0.5); padding: 2px 8px; border-radius: 8px; }
                  - type: conditional
                    conditions:
                    - condition: state
                      entity: sensor.snapmaker_u1_print_stage
                      state_not: [preparing, printing, paused, cooling, ready]
                    card:
                      type: markdown
                      content: |
                        <ha-icon icon="mdi:layers-triple-outline"></ha-icon>

                        **Layer view**

                        Fills in layer by layer while a print runs
                      card_mod:
                        style:
                          .: |
                            ha-card {
                              aspect-ratio: 1 / 1;
                              display: flex; align-items: center; justify-content: center; text-align: center;
                              border-radius: 16px;
                              border: 2px dashed rgba(148,163,184,0.45);
                              background: radial-gradient(300px 200px at 50% 0%, rgba(99,102,241,0.18), transparent 70%), rgba(15,23,42,0.75);
                            }
                            ha-markdown { padding: 0 14px !important; color: #94a3b8 !important; font-size: 13px; }
                            ha-markdown p { margin: 4px 0 !important; }
                          ha-markdown$: |
                            ha-icon { --mdc-icon-size: 64px; color: #64748b; display: block; margin: 0 auto; }
                            p { margin: 4px 0; }
          - type: custom:mushroom-template-card
            entity: sensor.YOURPRINTER_current_print_state
            layout: horizontal
            fill_container: true
            multiline_secondary: true
            primary: >
              {% set s = states('sensor.YOURPRINTER_current_print_state') %}
              {% set ly = states('sensor.YOURPRINTER_current_layer') | float(0) %}
              {% set bed = states('sensor.snapmaker_u1_bed_temp_f') | float(0) %}
              {% set pk = states('sensor.snapmaker_u1_bed_peak_temp_f') | float(bed) %}
              {% set pc = ([0, ([100, ((pk - bed) / (pk - 104) * 100) if pk - bed >= 0 and pk - 104 > 5 else 100] | min)] | max) | round(0) | int %}
              {% if s == 'printing' %}{% set stage = 'preparing' if ly <= 0 else 'printing' %}
              {% elif s == 'complete' %}{% set stage = 'cooling' if bed > 104 else 'ready' %}
              {% elif s in ['paused', 'error', 'cancelled'] %}{% set stage = s %}
              {% else %}{% set stage = 'idle' %}{% endif %}
              {% set sx = states('sensor.snapmaker_u1_print_stage') %}
              {% if sx not in ['unknown', 'unavailable', 'none', ''] %}{% set stage = sx %}{% endif %}
              {% set fn = states('sensor.YOURPRINTER_filename') | replace('.gcode','') | replace('_',' ') %}
              {% if stage in ['preparing','printing','paused','cooling','ready','error','cancelled'] and fn not in ['unknown','unavailable','none',''] %}{{ fn }}
              {% else %}No active job{% endif %}
            secondary: >
              {% set s = states('sensor.YOURPRINTER_current_print_state') %}
              {% set ly = states('sensor.YOURPRINTER_current_layer') | float(0) %}
              {% set bed = states('sensor.snapmaker_u1_bed_temp_f') | float(0) %}
              {% set pk = states('sensor.snapmaker_u1_bed_peak_temp_f') | float(bed) %}
              {% set pc = ([0, ([100, ((pk - bed) / (pk - 104) * 100) if pk - bed >= 0 and pk - 104 > 5 else 100] | min)] | max) | round(0) | int %}
              {% if s == 'printing' %}{% set stage = 'preparing' if ly <= 0 else 'printing' %}
              {% elif s == 'complete' %}{% set stage = 'cooling' if bed > 104 else 'ready' %}
              {% elif s in ['paused', 'error', 'cancelled'] %}{% set stage = s %}
              {% else %}{% set stage = 'idle' %}{% endif %}
              {% set sx = states('sensor.snapmaker_u1_print_stage') %}
              {% if sx not in ['unknown', 'unavailable', 'none', ''] %}{% set stage = sx %}{% endif %}
              {% if stage in ['preparing','printing','paused','cooling','ready','error','cancelled'] %}Current job{% else %}Snapmaker U1 is idle{% endif %}
            icon: >
              {% set s = states('sensor.YOURPRINTER_current_print_state') %}
              {% set ly = states('sensor.YOURPRINTER_current_layer') | float(0) %}
              {% set bed = states('sensor.snapmaker_u1_bed_temp_f') | float(0) %}
              {% set pk = states('sensor.snapmaker_u1_bed_peak_temp_f') | float(bed) %}
              {% set pc = ([0, ([100, ((pk - bed) / (pk - 104) * 100) if pk - bed >= 0 and pk - 104 > 5 else 100] | min)] | max) | round(0) | int %}
              {% if s == 'printing' %}{% set stage = 'preparing' if ly <= 0 else 'printing' %}
              {% elif s == 'complete' %}{% set stage = 'cooling' if bed > 104 else 'ready' %}
              {% elif s in ['paused', 'error', 'cancelled'] %}{% set stage = s %}
              {% else %}{% set stage = 'idle' %}{% endif %}
              {% set sx = states('sensor.snapmaker_u1_print_stage') %}
              {% if sx not in ['unknown', 'unavailable', 'none', ''] %}{% set stage = sx %}{% endif %}
              {{ {'preparing':'mdi:printer-3d-nozzle-heat','printing':'mdi:printer-3d-nozzle','paused':'mdi:pause-circle','cooling':'mdi:snowflake','ready':'mdi:check-circle','waiting':'mdi:timer-sand','error':'mdi:alert-circle','cancelled':'mdi:cancel','idle':'mdi:printer-3d'}[stage] }}
            icon_color: >
              {% set s = states('sensor.YOURPRINTER_current_print_state') %}
              {% set ly = states('sensor.YOURPRINTER_current_layer') | float(0) %}
              {% set bed = states('sensor.snapmaker_u1_bed_temp_f') | float(0) %}
              {% set pk = states('sensor.snapmaker_u1_bed_peak_temp_f') | float(bed) %}
              {% set pc = ([0, ([100, ((pk - bed) / (pk - 104) * 100) if pk - bed >= 0 and pk - 104 > 5 else 100] | min)] | max) | round(0) | int %}
              {% if s == 'printing' %}{% set stage = 'preparing' if ly <= 0 else 'printing' %}
              {% elif s == 'complete' %}{% set stage = 'cooling' if bed > 104 else 'ready' %}
              {% elif s in ['paused', 'error', 'cancelled'] %}{% set stage = s %}
              {% else %}{% set stage = 'idle' %}{% endif %}
              {% set sx = states('sensor.snapmaker_u1_print_stage') %}
              {% if sx not in ['unknown', 'unavailable', 'none', ''] %}{% set stage = sx %}{% endif %}
              {{ {'preparing':'orange','printing':'blue','paused':'orange','cooling':'blue','ready':'green','waiting':'grey','error':'red','cancelled':'amber','idle':'grey'}[stage] }}
            grid_options:
              columns: full
            tap_action:
              action: more-info
            card_mod:
              style: |
                ha-card {
                  zoom: 1.15;
                  border-radius: 16px;
                  border: 1px solid rgba(148,163,184,0.16);
                }
          - type: markdown
            content: |
              {% set e = 'sensor.YOURPRINTER_slicer_print_time_left_estimate' %}{% set v = states(e) %}
              {%- if is_number(v) and states('sensor.snapmaker_u1_print_stage') not in ['cooling', 'ready', 'waiting', 'idle', 'error', 'cancelled'] %}
              {% set u = state_attr(e, 'unit_of_measurement') | default(('h' if v | float(0) < 100 else 's'), true) %}
              {% set mins = (v | float * (60 if u in ['h','hr','hrs','hour','hours'] else 1 if u in ['min','m','mins','minute','minutes'] else 1/60)) | round(0) | int %}
              # {{ '%02d' % (mins // 60) }}:{{ '%02d' % (mins % 60) }}
              {% else %}
              # --:--
              {% endif %}

              HOURS : MINUTES REMAINING
              {% set sa = state_attr('sensor.snapmaker_u1_print_stage', 'started_at') %}
              {% set ea = state_attr('sensor.snapmaker_u1_print_stage', 'ended_at') %}
              {% set stg = states('sensor.snapmaker_u1_print_stage') %}
              {% if sa and stg in ['preparing', 'printing', 'paused', 'cooling', 'ready'] %}
              {% set t0 = as_datetime(sa) %}
              {% set t1 = as_datetime(ea) if ea else now() %}
              {% set sec = ((t1 - t0).total_seconds() | int) if t0 else 0 %}
              {% set sec = sec if sec > 0 else 0 %}

              {{ 'ELAPSED' if stg in ['preparing', 'printing', 'paused'] else 'PRINT TOOK' }} {{ '%02d' % (sec // 3600) }}:{{ '%02d' % ((sec % 3600) // 60) }}
              {% endif %}
            card_mod:
              style:
                .: |
                  ha-card {
                    background: linear-gradient(135deg, rgba(239,68,68,0.16), rgba(239,68,68,0.04));
                    border: 1px solid rgba(239,68,68,0.45);
                    border-radius: 16px;
                    display: flex; align-items: center; justify-content: center;
                    min-height: 0px;
                  }
                  ha-markdown { color: #ef4444 !important; text-align: center; padding: 6px 12px !important;
                    font-size: 12px; font-weight: 700; letter-spacing: 3px; }
                  ha-markdown h1 { font-size: 60px !important; font-weight: 900 !important; line-height: 1.05 !important;
                    margin: 0 0 2px 0 !important; letter-spacing: 3px; color: #ef4444 !important; border: 0; }
                ha-markdown$: |
                  h1 { font-size: 60px !important; font-weight: 900 !important; line-height: 1.05 !important;
                       margin: 0 0 2px 0 !important; letter-spacing: 3px; color: #ef4444 !important; border: 0; }
                  p { margin: 0; }
                  p + p { margin-top: 10px; color: #fca5a5 !important; font-size: 12px !important; letter-spacing: 2px !important; font-weight: 600 !important; }
          - type: vertical-stack
            card_mod:
              style: |
                #root { --stack-card-gap: 0px; gap: 0px; }
            cards:
              - type: conditional
                conditions:
                - condition: state
                  entity: YOUR_CAMERA_ENTITY_ID
                  state_not: [unavailable, unknown]
                card:
                  type: picture-entity
                  entity: YOUR_CAMERA_ENTITY_ID
                  camera_view: live
                  aspect_ratio: 16x9
                  show_name: false
                  show_state: false
                  tap_action:
                    action: more-info
                  card_mod:
                    style: |
                      {% set c = {'printing':'#3b82f6','paused':'#f59e0b','complete':'#22c55e','cancelled':'#a3a3a3','error':'#ef4444','standby':'#64748b'} %}
                      ha-card {
                        overflow: hidden;
                        border-radius: 20px;
                        border: 2px solid {{ c.get(states('sensor.YOURPRINTER_current_print_state'), '#64748b') }};
                      }
              - type: conditional
                conditions:
                - condition: state
                  entity: YOUR_CAMERA_ENTITY_ID
                  state: [unavailable, unknown]
                card:
                  type: markdown
                  content: |
                    <ha-icon icon="mdi:video-off-outline"></ha-icon>

                    **Camera is off**

                    The live view will return when the printer's camera is on
                  card_mod:
                    style:
                      .: |
                        ha-card {
                          aspect-ratio: 16 / 9;
                          display: flex; align-items: center; justify-content: center; text-align: center;
                          border-radius: 20px;
                          border: 2px dashed rgba(148,163,184,0.45);
