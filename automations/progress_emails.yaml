# Snapmaker U1 - progress snapshot emails (1%, 25%, 50%, 75%)
#
# Emails you a camera snapshot plus the printer's KPIs when a print reaches each milestone.
# Subject:  U1 3D @ ##% - <file name>
#
# Needs the SMTP integration (INSTALL.md, step 8) and the sensors from packages/snapmaker_u1.yaml.
# customize.py fills in YOUR_EMAIL_NOTIFY (the notify entity of your SMTP recipient).
# The camera snapshot is taken when the email is sent and embedded in the body.
#
# Add via Settings -> Automations & scenes -> Create automation -> (three dots) -> Edit in YAML.

alias: Snapmaker U1 - Progress Snapshot Emails
description: Emails a snapshot and KPI stats when the print reaches 1%, 25%, 50% and 75%.
mode: queued
max: 4

triggers:
  - trigger: numeric_state
    entity_id: sensor.YOURPRINTER_progress
    above: 0.99
    id: "1"
  - trigger: numeric_state
    entity_id: sensor.YOURPRINTER_progress
    above: 24.99
    id: "25"
  - trigger: numeric_state
    entity_id: sensor.YOURPRINTER_progress
    above: 49.99
    id: "50"
  - trigger: numeric_state
    entity_id: sensor.YOURPRINTER_progress
    above: 74.99
    id: "75"

conditions:
  - condition: state
    entity_id: sensor.YOURPRINTER_current_print_state
    state: printing
  # Ignore a milestone we only "crossed" because the sensor came back from unavailable mid-print
  - condition: template
    value_template: >-
      {{ states('sensor.YOURPRINTER_progress') | float(0) < (trigger.id | int + 5) }}

actions:
  - variables:
      pct: "{{ trigger.id }}"
      job: "{{ states('sensor.YOURPRINTER_filename') }}"
      state_txt: "{{ states('sensor.YOURPRINTER_current_print_state') | title }}"
      prog: "{{ states('sensor.YOURPRINTER_progress') | float(0) | round(0) | int }}"
      layer: "{{ states('sensor.YOURPRINTER_current_layer') }} / {{ states('sensor.YOURPRINTER_total_layer') }}"
      fil: "{{ states('sensor.YOURPRINTER_filament_used') | float(0) | round(1) }}"
      bed: "{{ states('sensor.snapmaker_u1_bed_temp_f') | float(0) | round(0) | int }}"
      cavity: "{{ states('sensor.snapmaker_u1_cavity_temp_f') | float(0) | round(0) | int }}"
      t1: "{{ states('sensor.snapmaker_u1_extruder_1_temp_f') | float(0) | round(0) | int }}"
      t2: "{{ states('sensor.snapmaker_u1_extruder_2_temp_f') | float(0) | round(0) | int }}"
      t3: "{{ states('sensor.snapmaker_u1_extruder_3_temp_f') | float(0) | round(0) | int }}"
      t4: "{{ states('sensor.snapmaker_u1_extruder_4_temp_f') | float(0) | round(0) | int }}"
      p1: "{{ states('sensor.YOURPRINTER_extruder_power') | float(0) | round(0) | int }}"
      p2: "{{ states('sensor.YOURPRINTER_extruder1_power') | float(0) | round(0) | int }}"
      p3: "{{ states('sensor.YOURPRINTER_extruder2_power') | float(0) | round(0) | int }}"
      p4: "{{ states('sensor.YOURPRINTER_extruder3_power') | float(0) | round(0) | int }}"
      mem: "{{ states('sensor.YOURPRINTER_memory_used') | float(0) | round(0) | int }}"
      jobs: "{{ states('sensor.YOURPRINTER_totals_jobs') | float(0) | int }}"
      tot_fil: "{{ states('sensor.YOURPRINTER_totals_filament_used') | float(0) | round(1) }}"
      left_txt: >-
        {% set e = 'sensor.YOURPRINTER_print_time_left' %}
        {% set v = states(e) %}
        {% if not is_number(v) %}—{% else %}
        {% set u = state_attr(e, 'unit_of_measurement') | default('h', true) %}
        {% set mins = (v | float * (60 if u in ['h','hr','hrs','hour','hours'] else 1 if u in ['min','m','mins','minute','minutes'] else 1/60)) | round(0) | int %}
        {% set t = now() + timedelta(minutes=mins) %}
        {% set h = mins // 60 %}{% set m = mins % 60 %}
        {{ h }} {{ 'Hour' if h == 1 else 'Hours' }} {{ m }} {{ 'Minute' if m == 1 else 'Minutes' }}
        {% endif %}
      eta_txt: >-
        {% set e = 'sensor.YOURPRINTER_print_time_left' %}
        {% set v = states(e) %}
        {% if is_number(v) %}
        {% set u = state_attr(e, 'unit_of_measurement') | default('h', true) %}
        {% set mins = (v | float * (60 if u in ['h','hr','hrs','hour','hours'] else 1 if u in ['min','m','mins','minute','minutes'] else 1/60)) | round(0) | int %}
        {% set t = now() + timedelta(minutes=mins) %}
        {% set dd = (t.date() - now().date()).days %}
        {% set day = 'Today' if dd == 0 else 'Tomorrow' if dd == 1 else '' %}
        {{ t.strftime('%-I:%M %p') }} {{ (day ~ ', ') if day else 'on ' }}{{ t.strftime('%A, %B %-d') }}
        {% else %}calculating…{% endif %}
      fun: >-
        {% set v = states('sensor.YOURPRINTER_filament_used') | float(0) %}
        {% set obj = [
         [0.15,'the length of a smartphone'], [0.3,'the length of a school ruler'],
         [0.55,'the height of a carry-on suitcase'], [0.86,'the length of a baseball bat'],
         [1.0,'the length of an acoustic guitar'], [1.8,'the height of a tall person'],
         [2.0,'the length of a king-size bed'], [2.4,"the height of a giraffe's neck"],
         [3.05,'the height of a basketball hoop'], [4.7,'the length of a family car'],
         [10.7,'the length of a school bus'], [12.2,'the length of a shipping container'],
         [18.3,'the length of a bowling lane'], [23.8,'the length of a tennis court'],
         [27.0,'the length of a blue whale'], [39.5,'the length of a Boeing 737'],
         [50.0,'the length of an Olympic swimming pool'], [70.7,'the length of a Boeing 747'],
         [91.4,'a football field, goal line to goal line'], [93.0,'the height of the Statue of Liberty'],
         [109.7,'the length of a football field, end zone to end zone'],
         [146.6,'the height of the Great Pyramid of Giza'], [169.0,'the height of the Washington Monument'],
         [330.0,'the height of the Eiffel Tower'], [381.0,'the height of the Empire State Building'],
         [508.0,'the height of Taipei 101'], [828.0,'the height of the Burj Khalifa'],
         [1000.0,'one kilometer'], [1609.0,'one mile'], [2737.0,'the length of the Golden Gate Bridge'],
         [5000.0,'a 5K race'], [8849.0,'the height of Mount Everest'], [10000.0,'a 10K race'],
         [21097.0,'a half marathon'], [42195.0,'a full marathon'] ] %}
        {% set ns = namespace(L=0, n='') %}
        {% for o in obj %}{% if v >= o[0] %}{% set ns.L = o[0] %}{% set ns.n = o[1] %}{% endif %}{% endfor %}
        {% if v <= 0 %}Nothing extruded yet
        {% elif ns.L == 0 %}Just getting started, still shorter than a smartphone
        {% else %}{% set r = v / ns.L %}
        {% if r < 1.25 %}≈ {{ ns.n }}!
        {% else %}≈ {{ (r | round(1)) if r < 10 else (r | round(0) | int) }}× {{ ns.n }}!{% endif %}
        {% endif %}

  # Sends the email. The camera snapshot is captured at send time and embedded in the HTML body.
  - action: smtp.send_message
    target:
      entity_id: YOUR_EMAIL_NOTIFY
    data:
      title: "U1 3D @ {{ pct }}% - {{ job }}"
      message: >-
        {{ job }} is {{ prog }}% complete ({{ pct }}% milestone).
        Estimated completion: {{ eta_txt }}
        Time remaining: {{ left_txt }}
        Layer: {{ layer }}
        Filament used: {{ fil }} m ({{ fun }})
        Bed {{ bed }}°F · Enclosure {{ cavity }}°F · Tools {{ t1 }}/{{ t2 }}/{{ t3 }}/{{ t4 }}°F
        Heater power {{ p1 }}/{{ p2 }}/{{ p3 }}/{{ p4 }}% · Memory {{ mem }}%
      attachments:
        - media_source:
            media_content_id: media-source://camera/YOUR_CAMERA_ENTITY_ID
            media_content_type: image/jpeg
          filename: snapmaker_u1.jpg
          content_id: snapmaker_u1_snapshot
      html: >-
        <div style="font-family:Arial,Helvetica,sans-serif;max-width:640px;margin:auto"><h2 style="margin:0 0 4px">🖨️ {{ job }}</h2><div style="font-size:20px;font-weight:bold;color:#6366f1;margin-bottom:10px">{{ pct }}% milestone · {{ prog }}% complete</div><img src="cid:snapmaker_u1_snapshot" alt="Latest snapshot from the Snapmaker U1" style="width:100%;border-radius:12px"><table style="width:100%;border-collapse:collapse;margin-top:12px;font-size:15px"><tr><td style="padding:7px 10px;border-bottom:1px solid #e5e7eb;color:#6b7280">Print state</td><td style="padding:7px 10px;border-bottom:1px solid #e5e7eb;text-align:right;font-weight:bold">{{ state_txt }}</td></tr><tr><td style="padding:7px 10px;border-bottom:1px solid #e5e7eb;color:#6b7280">Progress</td><td style="padding:7px 10px;border-bottom:1px solid #e5e7eb;text-align:right;font-weight:bold">{{ prog }}%</td></tr><tr><td style="padding:7px 10px;border-bottom:1px solid #e5e7eb;color:#6b7280">Estimated completion</td><td style="padding:7px 10px;border-bottom:1px solid #e5e7eb;text-align:right;font-weight:bold">{{ eta_txt }}</td></tr><tr><td style="padding:7px 10px;border-bottom:1px solid #e5e7eb;color:#6b7280">Time remaining</td><td style="padding:7px 10px;border-bottom:1px solid #e5e7eb;text-align:right;font-weight:bold">{{ left_txt }}</td></tr><tr><td style="padding:7px 10px;border-bottom:1px solid #e5e7eb;color:#6b7280">Layer</td><td style="padding:7px 10px;border-bottom:1px solid #e5e7eb;text-align:right;font-weight:bold">{{ layer }}</td></tr><tr><td style="padding:7px 10px;border-bottom:1px solid #e5e7eb;color:#6b7280">Filament used</td><td style="padding:7px 10px;border-bottom:1px solid #e5e7eb;text-align:right;font-weight:bold">{{ fil }} m</td></tr><tr><td style="padding:7px 10px;border-bottom:1px solid #e5e7eb;color:#6b7280">That&#39;s about</td><td style="padding:7px 10px;border-bottom:1px solid #e5e7eb;text-align:right;font-weight:bold">{{ fun }}</td></tr><tr><td style="padding:7px 10px;border-bottom:1px solid #e5e7eb;color:#6b7280">Heated bed</td><td style="padding:7px 10px;border-bottom:1px solid #e5e7eb;text-align:right;font-weight:bold">{{ bed }}°F</td></tr><tr><td style="padding:7px 10px;border-bottom:1px solid #e5e7eb;color:#6b7280">Enclosure</td><td style="padding:7px 10px;border-bottom:1px solid #e5e7eb;text-align:right;font-weight:bold">{{ cavity }}°F</td></tr><tr><td style="padding:7px 10px;border-bottom:1px solid #e5e7eb;color:#6b7280">Tools 1 / 2 / 3 / 4</td><td style="padding:7px 10px;border-bottom:1px solid #e5e7eb;text-align:right;font-weight:bold">{{ t1 }} / {{ t2 }} / {{ t3 }} / {{ t4 }} °F</td></tr><tr><td style="padding:7px 10px;border-bottom:1px solid #e5e7eb;color:#6b7280">Heater power 1 / 2 / 3 / 4</td><td style="padding:7px 10px;border-bottom:1px solid #e5e7eb;text-align:right;font-weight:bold">{{ p1 }} / {{ p2 }} / {{ p3 }} / {{ p4 }} %</td></tr><tr><td style="padding:7px 10px;border-bottom:1px solid #e5e7eb;color:#6b7280">Printer memory</td><td style="padding:7px 10px;border-bottom:1px solid #e5e7eb;text-align:right;font-weight:bold">{{ mem }}%</td></tr><tr><td style="padding:7px 10px;border-bottom:1px solid #e5e7eb;color:#6b7280">Lifetime</td><td style="padding:7px 10px;border-bottom:1px solid #e5e7eb;text-align:right;font-weight:bold">{{ jobs }} jobs · {{ tot_fil }} m filament</td></tr></table><p style="color:#9ca3af;font-size:12px">Sent by Home Assistant at {{ now().strftime('%-I:%M %p on %A, %B %-d') }}</p></div>
